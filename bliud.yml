name: Build APK and IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  APP_ID: com.gacha.simulator
  APP_NAME: 抽卡模拟器

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          mkdir -p www
          cp gacha.html www/index.html
          echo '{"name":"gacha-app","version":"1.0.0","private":true}' > package.json
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<EOF
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "ios": { "contentInset": "always" }
          }
          EOF
          npx cap add android
          npx cap sync android
          # keep the page below the status bar on Android 15+
          sed -i 's|<item name="windowNoTitle">true</item>|&\n        <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>|' android/app/src/main/res/values/styles.xml
          grep -n "OptOutEdgeToEdge" android/app/src/main/res/values/styles.xml || echo "warning: edge-to-edge opt-out not applied"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: gacha-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Capacitor project
        run: |
          mkdir -p www
          cp gacha.html www/index.html
          echo '{"name":"gacha-app","version":"1.0.0","private":true}' > package.json
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7
          cat > capacitor.config.json <<EOF
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "ios": { "contentInset": "always" }
          }
          EOF
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../gacha-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: gacha-ios-unsigned-ipa
          path: gacha-unsigned.ipa